<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <link rel="alternate icon" type="image/jpeg" href="/jeevan-setu-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Jeevan Setu - AI Disaster Response & GIS Intelligence Platform</title>

    <!-- PWA & Mobile Optimization Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jeevan Setu" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="description" content="AI Powered Disaster Response, Emergency SOS, Live GPS Tracking & GIS Intelligence Grid for North East India" />

    <!-- Google Fonts & Leaflet Stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased overflow-x-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register PWA Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('[Jeevan Setu PWA] Service Worker registered successfully:', reg.scope))
            .catch((err) => console.error('[Jeevan Setu PWA] Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
